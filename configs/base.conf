# google.cn、g.cn 跳转到 www.google.com
https://raw.githubusercontent.com/hirosesuzu0619/loon-rule/HEAD/plugins/personal.plugin, tag=个人, enabled=true

[Mitm]
# 证书在 App 里生成，ca-p12 与口令只保存在设备上的配置里，不要提交回仓库
